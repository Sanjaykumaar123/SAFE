services:
  - type: web
    name: safepath-citizen-backend
    env: python
    region: singapore # or oregon, frankfurt, etc.
    plan: free
    rootDir: citizen_app/backend/api
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: API_V1_PREFIX
        value: "/api"
      - key: AI_PROVIDER
        value: yolov8
      - key: AI_SERVER_URL
        value: https://safepath-ai-latest.onrender.com # primary detection path — offloads inference off this 512MB free-tier box, which OOMs running PyTorch itself
      - key: AI_MODEL_PATH
        value: app/ml_models/best.pt # only used as a fallback if AI_SERVER_URL is unreachable
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        sync: false # Set your Supabase / PostGIS Postgres URL here
      - key: DATABASE_URL_SYNC
        sync: false # Set your sync Supabase Postgres URL here
      - key: JWT_SECRET
        generateValue: true
